<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Pool Gallery</title>

<style>

/* FORCE DARK BACKGROUND */

html {
    background: #252525 !important;
    min-height: 100%;
}

body {
    margin: 0 !important;
    padding: 0 !important;

    background-color: #252525 !important;
    color: #ffffff !important;

    font-family: Arial, Helvetica, sans-serif;

    min-height: 100vh;
}


/* MAIN GALLERY */

.gallery {
    width: 100%;
    max-width: 800px;

    margin: 0 auto;

    padding: 20px 15px;

    text-align: center;

    background: #252525 !important;
}


/* IMAGE AREA */

.image-container {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    width: 100%;

    margin-bottom: 15px;
}


/* SMALLER IMAGES */

.image-container img {

    display: block;

    max-width: 60%;

    max-height: 350px;

    width: auto;

    height: auto;

    object-fit: contain;

    border-radius: 3px;
}


/* NAVIGATION BUTTONS */

.nav-button {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 38px;

    height: 38px;

    border-radius: 50%;

    border: 1px solid #555555;

    background: #3b3b3b !important;

    color: #ffffff !important;

    font-size: 22px;

    line-height: 1;

    cursor: pointer;

    display: flex;

    justify-content: center;

    align-items: center;

    transition: background 0.2s ease;
}


.nav-button:hover {

    background: #4a4a4a !important;
}


.prev {
    left: 10%;
}


.next {
    right: 10%;
}


/* INFORMATION */

.info {

    margin-top: 5px;

}


.name {

    font-size: 19px;

    font-weight: 600;

    margin-bottom: 5px;

    color: #ffffff !important;
}


.country {

    font-size: 14px;

    color: #d0d0d0 !important;

    margin-bottom: 4px;
}


.author {

    font-size: 12px;

    color: #a5a5a5 !important;
}


/* COUNTER */

.counter {

    margin-top: 12px;

    font-size: 12px;

    color: #a5a5a5 !important;
}


/* MOBILE */

@media (max-width: 700px) {

    .gallery {

        padding: 15px 10px;

    }


    .image-container img {

        max-width: 70%;

        max-height: 280px;

    }


    .nav-button {

        width: 34px;

        height: 34px;

        font-size: 19px;

    }


    .prev {

        left: 2%;

    }


    .next {

        right: 2%;

    }


    .name {

        font-size: 17px;

    }

}

</style>

</head>


<body>

<div class="gallery">


    <div class="image-container">


        <button
            class="nav-button prev"
            onclick="previousImage()"
            aria-label="Previous image">

            &#10094;

        </button>


        <img
            id="galleryImage"
            src=""
            alt="Sea pool">


        <button
            class="nav-button next"
            onclick="nextImage()"
            aria-label="Next image">

            &#10095;

        </button>


    </div>


    <div class="info">

        <div
            class="name"
            id="poolName">
        </div>


        <div
            class="country"
            id="poolCountry">
        </div>


        <div
            class="author"
            id="poolAuthor">
        </div>

    </div>


    <div
        class="counter"
        id="counter">
    </div>


</div>


<script>


const images = [

    {
        name: "Avalon Rock Pool",
        country: "Australia",
        author: "Thomas Yohei",
        url: "https://images.unsplash.com/photo-1599552894420-661f2ae0da78?q=80&w=1633&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },


    {
        name: "La Libertad Sea Pool",
        country: "El Salvador",
        author: "Meeg von Haartman",
        url: "https://images.unsplash.com/photo-1735770515751-9b49f00d2d8c?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },


    {
        name: "Piscina Azenhas do Mar",
        country: "Portugal",
        author: "Bea Vallejo",
        url: "https://images.unsplash.com/photo-1660083310880-441eb40f40bf?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG9zdWJ8fGVufDB8fHx8fA%3D%3D"
    },


    {
        name: "Glencairn Tidal Pool",
        country: "South Africa",
        author: "Simon Barber",
        url: "https://images.unsplash.com/photo-1662537748445-b2e851d18366?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },


    {
        name: "Bude Sea Pool",
        country: "United Kingdom",
        author: "Nick Russil",
        url: "https://images.unsplash.com/photo-1639406077808-9dd59d374b63?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    }

];


let currentIndex = 0;


function updateGallery() {

    const image =
        document.getElementById("galleryImage");

    const name =
        document.getElementById("poolName");

    const country =
        document.getElementById("poolCountry");

    const author =
        document.getElementById("poolAuthor");

    const counter =
        document.getElementById("counter");


    image.src =
        images[currentIndex].url;


    image.alt =
        images[currentIndex].name;


    name.textContent =
        images[currentIndex].name;


    country.textContent =
        images[currentIndex].country;


    author.textContent =
        "Photo: " + images[currentIndex].author;


    counter.textContent =
        (currentIndex + 1) + " / " + images.length;

}


function nextImage() {

    currentIndex++;

    if (currentIndex >= images.length) {

        currentIndex = 0;

    }

    updateGallery();

}


function previousImage() {

    currentIndex--;

    if (currentIndex < 0) {

        currentIndex = images.length - 1;

    }

    updateGallery();

}


/* INITIALIZE */

updateGallery();


</script>


</body>

</html>
